name: Resolve CJ product images

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/resolve-cj-images.yml"

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image URLs
        run: |
          python - <<'PY'
          import re, urllib.request
          products = {
            "magnetic-cable-clips": "https://cjdropshipping.com/product/magnetic-cable-clip-under-desk-cable-management-adjustable-cord-holder-wire-organizer-and-cable-management-wire-keeper-p-1763402968205897728.html",
            "sink-storage-rack": "https://cjdropshipping.com/product/kitchen-space-aluminum-sink-faucet-storage-rack-dishwasher-vegetable-sink-supplies-household-drain-basket-bathroom-accessories-p-2407020239431612500.html",
          }
          for slug,url in products.items():
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              html=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore")
              urls=[]
              for pattern in [
                  r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image',
                  r'https?://[^"\'<> ]+\.(?:jpg|jpeg|png|webp)'
              ]:
                  for u in re.findall(pattern, html, flags=re.I):
                      u=u.replace("\\/","/")
                      if ("cjdropshipping.com" in u or "cjdropshipping" in u) and u not in urls:
                          urls.append(u)
              print("PRODUCT",slug)
              for u in urls[:20]:
                  print(u)
          PY
