name: Inspect NOVAE design source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-design.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Rebuild source
        run: |
          cat archive/part*.b64 | base64 --decode > novae-public.zip
          mkdir -p dist
          unzip -q novae-public.zip -d dist
      - name: Show home
        run: |
          echo '===== INDEX.HTML ====='
          cat dist/novae-public/index.html
      - name: Show CSS
        run: |
          echo '===== STYLES.CSS ====='
          cat dist/novae-public/assets/styles.css
