name: Deploy NOVAE to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild NOVAE site archive
        run: |
          cat archive/part*.b64 | base64 --decode > novae-public.zip
          mkdir -p dist
          unzip -q novae-public.zip -d dist
          test -f dist/novae-public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload NOVAE
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/novae-public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
